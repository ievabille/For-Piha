<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pihas To Do List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;

      background: linear-gradient(135deg, #ffd6e7, #ffeef5);

      display: flex;
      justify-content: center;
      align-items: center;

      color: #4a2635;
    }

    /* Main card */
    .container {
      width: 90%;
      max-width: 500px;

      background: rgba(255, 255, 255, 0.9);

      padding: 40px;
      border-radius: 25px;

      box-shadow: 0 15px 40px rgba(180, 80, 120, 0.2);

      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #d94f83;
      font-size: 32px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #8c6070;
      font-size: 17px;
    }

    /* Checklist */
    .task {
      display: flex;
      align-items: center;

      background: #fff5f9;

      padding: 15px;
      margin: 12px 0;

      border-radius: 14px;

      cursor: pointer;

      transition: 0.2s;
    }

    .task:hover {
      transform: translateY(-2px);
      background: #ffe8f1;
      box-shadow: 0 5px 15px rgba(200, 80, 120, 0.12);
    }

    /* Custom checkbox */
    .task input {
      appearance: none;

      width: 22px;
      height: 22px;

      border: 2px solid #e477a0;
      border-radius: 7px;

      margin-right: 14px;

      cursor: pointer;

      position: relative;
      flex-shrink: 0;
    }

    .task input:checked {
      background: #e477a0;
    }

    .task input:checked::after {
      content: "✓";

      position: absolute;

      color: white;
      font-weight: bold;

      left: 4px;
      top: -1px;
    }

    .task label {
      cursor: pointer;
      font-size: 17px;
    }

    /* Popup background */
    .popup {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(60, 20, 40, 0.55);

      justify-content: center;
      align-items: center;

      padding: 20px;

      animation: fadeIn 0.2s ease;
    }

    /* Popup box */
    .popup-content {
      background: white;

      width: 100%;
      max-width: 380px;

      padding: 35px 30px;

      border-radius: 25px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

      animation: popIn 0.25s ease;
    }

    .popup-content h2 {
      margin-top: 0;

      color: #d94f83;

      font-size: 27px;
    }

    .popup-content p {
      font-size: 18px;
      color: #694554;

      margin: 20px 0;
    }

    /* Buttons */
    .popup button {
      border: none;

      padding: 12px 20px;

      margin: 6px;

      border-radius: 12px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .yes-button {
      background: #e477a0;
      color: white;
    }

    .yes-button:hover {
      background: #d95d8b;
      transform: scale(1.05);
    }

    .no-button {
      background: #f0e1e6;
      color: #704b59;
    }

    .no-button:hover {
      background: #e6ccd5;
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>Hey handsome ;)</h1>

    <p class="subtitle">
      ❤️ Pihas To Do List ❤️
    </p>


    <!-- TASK 1 -->
    <div class="task">
      <input
        type="checkbox"
        id="task1"
        onclick="showPopup('Did you really see me?'); checkAllTasks()"
      >

      <label for="task1">
        See Ieva
      </label>
    </div>


    <!-- TASK 2 -->
    <div class="task">
      <input
        type="checkbox"
        id="task2"
        onclick="showPopup('Did you really?'); checkAllTasks()"
      >

      <label for="task2">
        Compliment Ieva
      </label>
    </div>


    <!-- TASK 3 -->
    <div class="task">
      <input
        type="checkbox"
        id="task3"
        onclick="showPopup('Did you really?'); checkAllTasks()"
      >

      <label for="task3">
        Get food (with/for Ieva)
      </label>
    </div>


    <!-- TASK 4 -->
    <div class="task">
      <input
        type="checkbox"
        id="task4"
        onclick="showPopup('Did you really?'); checkAllTasks()"
      >

      <label for="task4">
        Cuddle Ieva
      </label>
    </div>

  </div>


  <!-- NORMAL POPUP -->

  <div class="popup" id="popup">

    <div class="popup-content">

      <h2>Double check </h2>

      <p id="popupText">
        Are you sure?
      </p>

      <button
        class="yes-button"
        type="button"
        onclick="showThankYou()"
      >
        Yes (yayy) 
      </button>

      <button
        class="no-button"
        type="button"
        onclick="showDoIt()"
      >
        No (BOOO) 
      </button>

    </div>

  </div>


  <!-- FINAL POPUP -->

  <div class="popup" id="finalPopup">

    <div class="popup-content">

      <h2> ❤️❤️❤️</h2>

      <p>
        Thank you baby now I'm happy!! &lt;3
        <img src="https://scontent.frix4-1.fna.fbcdn.net/v/t1.15752-9/774341955_1433843318561300_3363836290032761810_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=fc17b8&_nc_ohc=MzP68vv9slYQ7kNvwGe31Oj&_nc_oc=AdqwMvZv-x7aexIxhpZCwCUprfs-aTT886J0cKtB-4FuPzP0d-XnGwqoSVC1cNMfe-A&_nc_zt=23&_nc_ht=scontent.frix4-1.fna&_nc_ss=7b6a8&oh=03_Q7cD6AGTP6U5yEVFpGRj3k1Pk9Zwk09e49kTYLRcnYGFEMdDHg&oe=6AA5271E" alt="Me smiling">
      </p>

    </div>

  </div>


  <script>

    /* Opens the normal popup */

    function showPopup(message) {

      document.getElementById("popupText").textContent = message;

      document.getElementById("popup").style.display = "flex";
    }


    /* YES button */

    function showThankYou() {

      document.getElementById("popupText").textContent =
        "Thank you baby <3";

      setTimeout(closePopup, 1500);
    }


    /* NO button */

    function showDoIt() {

      document.getElementById("popupText").textContent =
        "Do it then :(";
    }


    /* Closes normal popup */

    function closePopup() {

      document.getElementById("popup").style.display = "none";
    }


    /* Checks if all four tasks are completed */

    function checkAllTasks() {

      const tasks = document.querySelectorAll(
        'input[type="checkbox"]'
      );

      const allChecked =
        [...tasks].every(task => task.checked);


      if (allChecked) {

        setTimeout(function() {

          document.getElementById("finalPopup").style.display = "flex";

        }, 500);

      }

    }

  </script>

</body>

</html>
